name: Universal Android Auto Build Repair

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: universal-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Scan → Analyze → Repair → Build → Verify
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle-home
      MAX_ATTEMPTS: "5"
      CI_DIAGNOSTICS: ".ci"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan Android Project
        id: scan
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$CI_DIAGNOSTICS"

          echo "=== UNIVERSAL ANDROID PROJECT SCAN ==="
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Commit: $GITHUB_SHA"
          echo "Runner: $RUNNER_OS / $(uname -m)"
          echo "CPU: $(nproc)"

          mapfile -t SETTINGS < <(find . -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -not -path './.git/*' \
            -not -path './.gradle-home/*' | sort)

          BUILD_ROOT=""

          for f in "${SETTINGS[@]:-}"; do
            dir="$(dirname "$f")"
            if find "$dir" -type f -name AndroidManifest.xml \
              -not -path '*/build/*' | grep -q .; then
              BUILD_ROOT="$dir"
              break
            fi
          done

          if [ -z "$BUILD_ROOT" ] && [ -f ./gradlew ]; then
            BUILD_ROOT="."
          fi

          if [ -z "$BUILD_ROOT" ]; then
            echo "ERROR: No Android/Gradle project detected."
            find . -maxdepth 4 -type f | sort | head -500
            exit 1
          fi

          echo "BUILD_ROOT=$BUILD_ROOT" >> "$GITHUB_ENV"
          echo "Detected build root: $BUILD_ROOT"

          {
            echo "=== PROJECT FILE MAP ==="
            find "$BUILD_ROOT" -not -path '*/.git/*' -not -path '*/build/*' -print | sort
          } > "$CI_DIAGNOSTICS/project-map.txt"

          {
            echo "=== IMPORTANT FILES ==="
            find "$BUILD_ROOT" -type f \
              \( -name '*.gradle' -o -name '*.gradle.kts' \
              -o -name 'libs.versions.toml' -o -name 'gradle.properties' \
              -o -name 'gradle-wrapper.properties' -o -name 'AndroidManifest.xml' \) \
              -not -path '*/build/*' -print | sort
          } > "$CI_DIAGNOSTICS/config-files.txt"

          echo "Android project detected."

      - name: Inspect Project Configuration
        shell: bash
        run: |
          set -euo pipefail
          cd "$BUILD_ROOT"

          echo "=== CONFIGURATION ANALYSIS ==="

          find . -type f \
            \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \
            -o -name 'build.gradle' -o -name 'build.gradle.kts' \
            -o -name 'libs.versions.toml' -o -name 'gradle.properties' \
            -o -name 'gradle-wrapper.properties' \) \
            -not -path '*/build/*' \
            -exec sh -c 'echo; echo "===== $1 ====="; cat "$1"' _ {} \; \
            > "$GITHUB_WORKSPACE/$CI_DIAGNOSTICS/configuration.txt"

          grep -RniE \
            'com.android.application|com.android.library|com.android.tools.build:gradle|agp' \
            --include='*.gradle' --include='*.gradle.kts' --include='*.toml' . \
            2>/dev/null | head -500 > "$GITHUB_WORKSPACE/$CI_DIAGNOSTICS/agp.txt" || true

          grep -RniE \
            'kotlin|ksp|kapt' \
            --include='*.gradle' --include='*.gradle.kts' --include='*.toml' . \
            2>/dev/null | head -500 > "$GITHUB_WORKSPACE/$CI_DIAGNOSTICS/kotlin.txt" || true

          grep -RniE \
            'androidx.compose|compose-bom|composeOptions' \
            --include='*.gradle' --include='*.gradle.kts' --include='*.toml' . \
            2>/dev/null | head -500 > "$GITHUB_WORKSPACE/$CI_DIAGNOSTICS/compose.txt" || true

          grep -RniE \
            'androidx.room|room-runtime|room-ktx|room-compiler' \
            --include='*.gradle' --include='*.gradle.kts' --include='*.toml' . \
            2>/dev/null | head -500 > "$GITHUB_WORKSPACE/$CI_DIAGNOSTICS/room.txt" || true

      - name: Detect Gradle and Java Requirements
        shell: bash
        run: |
          set -euo pipefail
          cd "$BUILD_ROOT"

          VERSION=""

          if [ -f gradle/wrapper/gradle-wrapper.properties ]; then
            VERSION="$(grep -oE 'gradle-[0-9]+(\.[0-9]+){1,2}' \
              gradle/wrapper/gradle-wrapper.properties \
              | head -1 | sed 's/gradle-//' || true)"
          fi

          if [ -z "$VERSION" ]; then
            VERSION="8.7"
            echo "No wrapper version detected; using conservative bootstrap Gradle $VERSION."
          else
            echo "Detected Gradle $VERSION."
          fi

          echo "GRADLE_VERSION=$VERSION" >> "$GITHUB_ENV"

          MAJOR="${VERSION%%.*}"
          if [ "$MAJOR" -ge 9 ]; then
            JDK=17
          elif [ "$MAJOR" -ge 8 ]; then
            JDK=17
          elif [ "$MAJOR" -ge 7 ]; then
            JDK=11
          else
            JDK=11
          fi

          echo "JDK_VERSION=$JDK" >> "$GITHUB_ENV"
          printf 'Gradle=%s\nJDK=%s\n' "$VERSION" "$JDK" > "$GITHUB_WORKSPACE/$CI_DIAGNOSTICS/toolchain.txt"

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JDK_VERSION }}
          cache: gradle

      - name: Prepare Gradle
        shell: bash
        run: |
          set -euo pipefail
          cd "$BUILD_ROOT"

          GRADLE_CMD=""

          if [ -f ./gradlew ] && [ -f gradle/wrapper/gradle-wrapper.jar ] \
             && [ -f gradle/wrapper/gradle-wrapper.properties ]; then

            chmod +x ./gradlew

            if ./gradlew --version > "$GITHUB_WORKSPACE/$CI_DIAGNOSTICS/wrapper-test.txt" 2>&1; then
              GRADLE_CMD="$BUILD_ROOT/gradlew"
              echo "Using repository Gradle Wrapper."
            else
              echo "Repository wrapper failed; bootstrapping matching Gradle."
            fi
          fi

          if [ -z "$GRADLE_CMD" ]; then
            mkdir -p "$GITHUB_WORKSPACE/.ci/gradle"
            cd "$GITHUB_WORKSPACE/.ci/gradle"

            if [ ! -x "gradle-$GRADLE_VERSION/bin/gradle" ]; then
              wget -q "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
              unzip -q "gradle-${GRADLE_VERSION}-bin.zip"
            fi

            GRADLE_CMD="$GITHUB_WORKSPACE/.ci/gradle/gradle-$GRADLE_VERSION/bin/gradle"
          fi

          echo "GRADLE_CMD=$GRADLE_CMD" >> "$GITHUB_ENV"
          "$GRADLE_CMD" --version | tee "$GITHUB_WORKSPACE/$CI_DIAGNOSTICS/gradle-version.txt"

      - name: Discover Android Build Tasks
        shell: bash
        run: |
          set +e
          cd "$BUILD_ROOT"

          "$GRADLE_CMD" projects --no-daemon --console=plain \
            2>&1 | tee "$GITHUB_WORKSPACE/$CI_DIAGNOSTICS/projects.txt"

          "$GRADLE_CMD" tasks --all --no-daemon --console=plain \
            2>&1 | tee "$GITHUB_WORKSPACE/$CI_DIAGNOSTICS/tasks.txt"

          TASK=""

          if grep -qE '(^|[[:space:]])assembleDebug([[:space:]]|$)' \
              "$GITHUB_WORKSPACE/$CI_DIAGNOSTICS/tasks.txt"; then
            TASK="assembleDebug"
          elif grep -qE '(^|[[:space:]])assembleRelease([[:space:]]|$)' \
              "$GITHUB_WORKSPACE/$CI_DIAGNOSTICS/tasks.txt"; then
            TASK="assembleRelease"
          elif grep -qE '(^|[[:space:]])assemble([[:space:]]|$)' \
              "$GITHUB_WORKSPACE/$CI_DIAGNOSTICS/tasks.txt"; then
            TASK="assemble"
          fi

          if [ -z "$TASK" ]; then
            echo "ERROR: No Android assemble task detected."
            exit 1
          fi

          echo "BUILD_TASK=$TASK" >> "$GITHUB_ENV"
          echo "Selected: $TASK"

      - name: Safe Build-State Cleanup
        shell: bash
        run: |
          set -euo pipefail

          # Only generated state is removed. Source/configuration is untouched.
          find "$BUILD_ROOT" -type d \
            \( -name build -o -name .gradle \) \
            -not -path '*/.git/*' \
            -prune -exec rm -rf {} + 2>/dev/null || true

          find "$BUILD_ROOT" -type f -name gradlew \
            -exec chmod +x {} \; 2>/dev/null || true

      - name: Adaptive Build and Error Repair Loop
        id: repair
        shell: bash
        run: |
          set +e

          mkdir -p "$GITHUB_WORKSPACE/$CI_DIAGNOSTICS/builds"

          ATTEMPT=1
          SUCCESS=0

          while [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]; do

            LOG="$GITHUB_WORKSPACE/$CI_DIAGNOSTICS/builds/attempt-${ATTEMPT}.log"

            echo
            echo "============================================================"
            echo "BUILD ATTEMPT $ATTEMPT / $MAX_ATTEMPTS"
            echo "TASK: $BUILD_TASK"
            echo "============================================================"

            cd "$BUILD_ROOT"

            "$GRADLE_CMD" "$BUILD_TASK" \
              --no-daemon \
              --console=plain \
              --stacktrace \
              --warning-mode=all \
              2>&1 | tee "$LOG"

            STATUS=${PIPESTATUS[0]}

            if [ "$STATUS" -eq 0 ]; then
              SUCCESS=1
              echo "BUILD SUCCESSFUL"
              break
            fi

            echo "BUILD FAILED: $STATUS"

            # ---------------- ROOT CAUSE REPORT ----------------
            {
              echo "===== WHAT WENT WRONG ====="
              grep -nA30 'What went wrong:' "$LOG" | head -150 || true
              echo
              echo "===== FAILED TASK ====="
              grep -E 'Execution failed for task|FAILURE:|BUILD FAILED' "$LOG" | tail -100 || true
              echo
              echo "===== CAUSED BY ====="
              grep -nA20 'Caused by:' "$LOG" | head -150 || true
              echo
              echo "===== IMPORTANT ERRORS ====="
              grep -Ei \
                'error:|e: |exception|failed|failure|cannot|could not|unsupported|incompatible|duplicate|unresolved reference' \
                "$LOG" | tail -250 || true
            } > "$GITHUB_WORKSPACE/$CI_DIAGNOSTICS/builds/root-cause-${ATTEMPT}.txt"

            # ====================================================
            # SAFE REPAIR RULE 1: TRANSIENT NETWORK/DEPENDENCY
            # ====================================================
            if grep -Eqi \
              'Could not resolve|Could not GET|Could not HEAD|Connection reset|Connection timed out|Temporary failure|PKIX|UnknownHostException|Network is unreachable|metadata.*could not be retrieved' \
              "$LOG"; then

              echo "Repair: clearing dependency metadata/cache."
              rm -rf \
                "$GRADLE_USER_HOME/caches/modules-2/metadata-*" \
                "$GRADLE_USER_HOME/caches/modules-2/files-2.1" \
                2>/dev/null || true

              ATTEMPT=$((ATTEMPT + 1))
              continue
            fi

            # ====================================================
            # SAFE REPAIR RULE 2: GRADLE DAEMON/JVM STATE
            # ====================================================
            if grep -Eqi \
              'DaemonDisappearedException|daemon disappeared|OutOfMemoryError|Java heap space|GC overhead limit exceeded|Metaspace' \
              "$LOG"; then

              echo "Repair: stopping daemon and clearing generated Gradle state."
              "$GRADLE_CMD" --stop >/dev/null 2>&1 || true
              rm -rf "$BUILD_ROOT/.gradle" "$GRADLE_USER_HOME/caches" 2>/dev/null || true

              ATTEMPT=$((ATTEMPT + 1))
              continue
            fi

            # ====================================================
            # SAFE REPAIR RULE 3: KSP/INTELLIJ AWT DIAGNOSTIC
            # ====================================================
            if grep -Eqi \
              'AWT-EventQueue-0|ApplicationManager.getApplication\(\).*null|ksp\.com\.intellij|com\.intellij\.openapi\.application' \
              "$LOG"; then

              if ! grep -Eqi \
                'Execution failed for task.*ksp|:ksp[^ ]* FAILED|KSP.*(error|failed)|KotlinSymbolProcessing' \
                "$LOG"; then

                echo "AWT/KSP IntelliJ message is not proven to be the build root cause."
                echo "Retrying without modifying source code."

                ATTEMPT=$((ATTEMPT + 1))
                continue
              fi

              echo "KSP failure is build-critical."

              if grep -Eqi 'Could not resolve.*ksp|ksp.*Could not resolve' "$LOG"; then
                rm -rf "$GRADLE_USER_HOME/caches/modules-2" 2>/dev/null || true
                ATTEMPT=$((ATTEMPT + 1))
                continue
              fi

              echo "No safe KSP source/configuration repair available."
              break
            fi

            # ====================================================
            # SAFE REPAIR RULE 4: WRAPPER
            # ====================================================
            if grep -Eqi \
              'GradleWrapperMain|gradle-wrapper\.jar|Could not find or load main class org\.gradle\.wrapper' \
              "$LOG"; then

              echo "Repair: switching to downloaded Gradle engine."
              FALLBACK="$GITHUB_WORKSPACE/.ci/gradle/gradle-$GRADLE_VERSION/bin/gradle"

              if [ -x "$FALLBACK" ]; then
                echo "GRADLE_CMD=$FALLBACK" >> "$GITHUB_ENV"
                export GRADLE_CMD="$FALLBACK"
                ATTEMPT=$((ATTEMPT + 1))
                continue
              fi

              break
            fi

            # ====================================================
            # SAFE REPAIR RULE 5: FILE LOCK/CACHE CORRUPTION
            # ====================================================
            if grep -Eqi \
              'Could not acquire lock|Timeout waiting to lock|cache.*corrupt|corrupt.*cache|failed to read cache' \
              "$LOG"; then

              echo "Repair: removing generated cache/lock state."
              "$GRADLE_CMD" --stop >/dev/null 2>&1 || true
              find "$BUILD_ROOT" -type f \
                \( -name '*.lock' -o -name '*.lck' \) \
                -not -path '*/src/*' \
                -delete 2>/dev/null || true

              rm -rf "$BUILD_ROOT/.gradle" 2>/dev/null || true

              ATTEMPT=$((ATTEMPT + 1))
              continue
            fi

            # ====================================================
            # SOURCE/COMPILER/AGP ERRORS
            # ====================================================
            if grep -Eqi \
              'Unresolved reference|Type mismatch|Compilation error|Expecting |Cannot access|Duplicate class|resource .* already defined|Manifest merger failed|AAPT:|Android resource linking failed|DexArchiveMergerException|Duplicate resources|Kotlin compiler|Java compilation' \
              "$LOG"; then

              echo "Build failure requires source/configuration-specific changes."
              echo "No destructive automatic source modification will be attempted."
              break
            fi

            echo "No safe automatic repair rule matched."
            break
          done

          if [ "$SUCCESS" -ne 1 ]; then
            echo "BUILD FAILED after $ATTEMPT attempt(s)."
            exit 1
          fi

      - name: Verify APK
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t APKS < <(
            find "$BUILD_ROOT" -type f \
              -path '*/build/outputs/apk/*.apk' \
              -not -path '*/intermediates/*' \
              -print
          )

          if [ "${#APKS[@]}" -eq 0 ]; then
            echo "ERROR: Build succeeded but no APK was produced."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/final-apk"

          for apk in "${APKS[@]}"; do
            echo "APK: $apk"
            ls -lh "$apk"
            cp "$apk" "$GITHUB_WORKSPACE/final-apk/"
          done

          echo "Produced APK files:"
          find "$GITHUB_WORKSPACE/final-apk" -type f -name '*.apk' -exec ls -lh {} \;

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: final-apk/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-AutoBuild-Diagnostics
          path: .ci/
          if-no-files-found: warn
          retention-days: 14

      - name: Commit Safe Wrapper Repair
        if: success()
        shell: bash
        run: |
          set +e

          cd "$BUILD_ROOT"

          if [ -f gradlew ] && [ -f gradlew.bat ] && [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add gradlew gradlew.bat gradle/wrapper 2>/dev/null || true

            if ! git diff --cached --quiet; then
              git commit -m "ci: repair Gradle wrapper automatically"
              git push
            else
              echo "No wrapper changes to commit."
            fi
          fi
