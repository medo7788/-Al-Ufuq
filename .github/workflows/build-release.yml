name: Build Release APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Optimized Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Clean project
        run: ./gradlew clean

      - name: Build Release APK
        run: |
          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace \
            --build-cache

      - name: Locate APK
        run: |
          echo "Generated APK files:"
          find app/build/outputs/apk -type f -name "*.apk" -print

      - name: Show APK sizes
        run: |
          echo "APK sizes:"
          find app/build/outputs/apk -type f -name "*.apk" \
            -exec du -h {} \;

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Al-Ufuq-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
