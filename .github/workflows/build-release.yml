name: Project Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: Diagnose Android Project
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. Basic System Information
      # ============================================================

      - name: System Information
        run: |
          echo "=============================================="
          echo "SYSTEM INFORMATION"
          echo "=============================================="

          echo "OS:"
          cat /etc/os-release

          echo ""
          echo "Kernel:"
          uname -a

          echo ""
          echo "Architecture:"
          uname -m

          echo ""
          echo "CPU:"
          nproc

          echo ""
          echo "Memory:"
          free -h

          echo ""
          echo "Disk:"
          df -h

          echo ""
          echo "Java:"
          java -version || true

          echo ""
          echo "JAVA_HOME:"
          echo "$JAVA_HOME"

      # ============================================================
      # 3. Repository Structure
      # ============================================================

      - name: Repository Structure
        run: |
          echo "=============================================="
          echo "REPOSITORY STRUCTURE"
          echo "=============================================="

          echo ""
          echo "Root:"
          pwd

          echo ""
          echo "Top-level files:"
          ls -la

          echo ""
          echo "Directories:"
          find . -maxdepth 3 -type d \
            -not -path "./.git/*" \
            | sort

          echo ""
          echo "Important files:"
          find . -type f \
            \( \
              -name "settings.gradle" \
              -o -name "settings.gradle.kts" \
              -o -name "build.gradle" \
              -o -name "build.gradle.kts" \
              -o -name "gradle.properties" \
              -o -name "libs.versions.toml" \
              -o -name "gradle-wrapper.properties" \
              -o -name "gradle-wrapper.jar" \
              -o -name "gradlew" \
              -o -name "gradlew.bat" \
            \) \
            -not -path "./.git/*" \
            | sort

      # ============================================================
      # 4. Find Android Projects
      # ============================================================

      - name: Detect Android Projects
        run: |
          echo "=============================================="
          echo "ANDROID PROJECT DETECTION"
          echo "=============================================="

          echo ""
          echo "settings.gradle files:"
          find . -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -not -path "./.git/*" \
            -print

          echo ""
          echo "AndroidManifest.xml files:"
          find . -type f \
            -name "AndroidManifest.xml" \
            -not -path "./.git/*" \
            -print

          echo ""
          echo "build.gradle files:"
          find . -type f \
            \( -name "build.gradle" -o -name "build.gradle.kts" \) \
            -not -path "./.git/*" \
            -print

      # ============================================================
      # 5. Gradle Wrapper Information
      # ============================================================

      - name: Gradle Wrapper Information
        run: |
          echo "=============================================="
          echo "GRADLE WRAPPER"
          echo "=============================================="

          echo ""
          echo "gradlew:"
          find . -type f \
            -name "gradlew" \
            -not -path "./.git/*" \
            -print

          echo ""
          echo "Wrapper properties:"
          find . -type f \
            -name "gradle-wrapper.properties" \
            -not -path "./.git/*" \
            -exec sh -c '
              echo "----- $1 -----"
              cat "$1"
            ' _ {} \;

          echo ""
          echo "Wrapper JAR:"
          find . -type f \
            -name "gradle-wrapper.jar" \
            -not -path "./.git/*" \
            -exec ls -lh {} \;

      # ============================================================
      # 6. Install Java 17
      # ============================================================

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # 7. Gradle Installation
      # ============================================================

      - name: Install Gradle 9.3.1
        run: |
          set -e

          GRADLE_VERSION=9.3.1

          wget -q \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"

          unzip -q \
            "gradle-${GRADLE_VERSION}-bin.zip"

          echo "$PWD/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

          echo "Gradle installed."

      # ============================================================
      # 8. Gradle Version
      # ============================================================

      - name: Gradle Version
        run: |
          echo "=============================================="
          echo "GRADLE VERSION"
          echo "=============================================="

          gradle --version

      # ============================================================
      # 9. Read Version Catalog
      # ============================================================

      - name: Version Catalog
        run: |
          echo "=============================================="
          echo "VERSION CATALOG"
          echo "=============================================="

          FOUND=false

          while IFS= read -r file; do

            FOUND=true

            echo ""
            echo "=============================================="
            echo "$file"
            echo "=============================================="

            cat "$file"

          done < <(
            find . -type f \
              -name "libs.versions.toml" \
              -not -path "./.git/*"
          )

          if [ "$FOUND" = false ]; then
            echo "No libs.versions.toml found."
          fi

      # ============================================================
      # 10. Gradle Properties
      # ============================================================

      - name: Gradle Properties
        run: |
          echo "=============================================="
          echo "GRADLE PROPERTIES"
          echo "=============================================="

          while IFS= read -r file; do

            echo ""
            echo "=============================================="
            echo "$file"
            echo "=============================================="

            cat "$file"

          done < <(
            find . -type f \
              -name "gradle.properties" \
              -not -path "./.git/*"
          )

      # ============================================================
      # 11. Build Files
      # ============================================================

      - name: Gradle Build Files
        run: |
          echo "=============================================="
          echo "GRADLE BUILD FILES"
          echo "=============================================="

          while IFS= read -r file; do

            echo ""
            echo "=============================================="
            echo "$file"
            echo "=============================================="

            cat "$file"

          done < <(
            find . -type f \
              \( \
                -name "build.gradle" \
                -o -name "build.gradle.kts" \
              \) \
              -not -path "./.git/*" \
              | sort
          )

      # ============================================================
      # 12. Settings Files
      # ============================================================

      - name: Gradle Settings
        run: |
          echo "=============================================="
          echo "GRADLE SETTINGS"
          echo "=============================================="

          while IFS= read -r file; do

            echo ""
            echo "=============================================="
            echo "$file"
            echo "=============================================="

            cat "$file"

          done < <(
            find . -type f \
              \( \
                -name "settings.gradle" \
                -o -name "settings.gradle.kts" \
              \) \
              -not -path "./.git/*"
          )

      # ============================================================
      # 13. Detect Kotlin
      # ============================================================

      - name: Kotlin Detection
        run: |
          echo "=============================================="
          echo "KOTLIN DETECTION"
          echo "=============================================="

          echo ""
          echo "Kotlin source files:"
          find . -type f \
            \( -name "*.kt" -o -name "*.kts" \) \
            -not -path "./.git/*" \
            | wc -l

          echo ""
          echo "Kotlin files:"
          find . -type f \
            \( -name "*.kt" -o -name "*.kts" \) \
            -not -path "./.git/*" \
            | head -100

          echo ""
          echo "Kotlin references:"
          grep -RniE \
            "kotlin|ksp|kotlinCompilerExtensionVersion" \
            --include="*.gradle" \
            --include="*.gradle.kts" \
            --include="libs.versions.toml" \
            . \
            2>/dev/null \
            | head -300 || true

      # ============================================================
      # 14. Detect KSP
      # ============================================================

      - name: KSP Detection
        run: |
          echo "=============================================="
          echo "KSP DETECTION"
          echo "=============================================="

          grep -RniE \
            "ksp|com.google.devtools.ksp" \
            --include="*.gradle" \
            --include="*.gradle.kts" \
            --include="libs.versions.toml" \
            . \
            2>/dev/null \
            | head -300 || true

      # ============================================================
      # 15. Detect Android Gradle Plugin
      # ============================================================

      - name: AGP Detection
        run: |
          echo "=============================================="
          echo "ANDROID GRADLE PLUGIN"
          echo "=============================================="

          grep -RniE \
            "com.android.application|com.android.library|com.android.tools.build:gradle|agp" \
            --include="*.gradle" \
            --include="*.gradle.kts" \
            --include="libs.versions.toml" \
            . \
            2>/dev/null \
            | head -300 || true

      # ============================================================
      # 16. Detect Compose
      # ============================================================

      - name: Compose Detection
        run: |
          echo "=============================================="
          echo "JETPACK COMPOSE"
          echo "=============================================="

          grep -RniE \
            "compose|composeOptions|compose-bom|androidx.compose" \
            --include="*.gradle" \
            --include="*.gradle.kts" \
            --include="libs.versions.toml" \
            . \
            2>/dev/null \
            | head -300 || true

      # ============================================================
      # 17. Detect Room
      # ============================================================

      - name: Room Detection
        run: |
          echo "=============================================="
          echo "ROOM"
          echo "=============================================="

          grep -RniE \
            "room|androidx.room" \
            --include="*.gradle" \
            --include="*.gradle.kts" \
            --include="libs.versions.toml" \
            . \
            2>/dev/null \
            | head -200 || true

      # ============================================================
      # 18. Detect Dependencies
      # ============================================================

      - name: Dependency Detection
        run: |
          echo "=============================================="
          echo "IMPORTANT DEPENDENCIES"
          echo "=============================================="

          grep -RniE \
            "implementation|api|kapt|ksp|compileOnly|runtimeOnly" \
            --include="*.gradle" \
            --include="*.gradle.kts" \
            . \
            2>/dev/null \
            | head -500 || true

      # ============================================================
      # 19. Android SDK
      # ============================================================

      - name: Android SDK Information
        run: |
          echo "=============================================="
          echo "ANDROID SDK"
          echo "=============================================="

          echo ""
          echo "ANDROID_HOME:"
          echo "$ANDROID_HOME"

          echo ""
          echo "ANDROID_SDK_ROOT:"
          echo "$ANDROID_SDK_ROOT"

          echo ""
          echo "Installed SDK platforms:"
          ls -la "$ANDROID_SDK_ROOT/platforms" 2>/dev/null || true

          echo ""
          echo "Installed Build Tools:"
          ls -la "$ANDROID_SDK_ROOT/build-tools" 2>/dev/null || true

      # ============================================================
      # 20. Android Manifest Information
      # ============================================================

      - name: Android Manifest
        run: |
          echo "=============================================="
          echo "ANDROID MANIFESTS"
          echo "=============================================="

          while IFS= read -r file; do

            echo ""
            echo "=============================================="
            echo "$file"
            echo "=============================================="

            grep -E \
              "package=|namespace|android:minSdkVersion|android:targetSdkVersion|android:versionCode|android:versionName" \
              "$file" \
              || true

          done < <(
            find . -type f \
              -name "AndroidManifest.xml" \
              -not -path "./.git/*"
          )

      # ============================================================
      # 21. Assets
      # ============================================================

      - name: Assets Information
        run: |
          echo "=============================================="
          echo "ASSETS"
          echo "=============================================="

          find . -type d \
            -name "assets" \
            -not -path "./.git/*" \
            -print

          echo ""

          find . -type f \
            -path "*/assets/*" \
            -not -path "./.git/*" \
            -exec du -h {} \; \
            | sort -h

      # ============================================================
      # 22. Large Files
      # ============================================================

      - name: Large Files
        run: |
          echo "=============================================="
          echo "LARGEST PROJECT FILES"
          echo "=============================================="

          find . -type f \
            -not -path "./.git/*" \
            -printf "%s %p\n" \
            | sort -nr \
            | head -100 \
            | numfmt --field=1 --to=iec

      # ============================================================
      # 23. Gradle Tasks
      # ============================================================

      - name: Gradle Project Tasks
        run: |
          echo "=============================================="
          echo "GRADLE TASKS"
          echo "=============================================="

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew tasks --all --no-daemon --stacktrace \
              2>&1 | tee gradle-tasks.log || true
          else
            echo "No gradlew found."
          fi

      # ============================================================
      # 24. Generate Diagnostic Report
      # ============================================================

      - name: Create Diagnostic Report
        run: |

          {
            echo "ANDROID PROJECT DIAGNOSTIC REPORT"
            echo "================================="
            echo ""
            echo "Repository:"
            git remote -v || true
            echo ""
            echo "Commit:"
            git rev-parse HEAD || true
            echo ""
            echo "Branch:"
            git branch --show-current || true
            echo ""
            echo "Java:"
            java -version 2>&1 || true
            echo ""
            echo "Gradle:"
            gradle --version || true
            echo ""
            echo "Files:"
            find . -maxdepth 4 -type f \
              -not -path "./.git/*" \
              | sort
            echo ""
            echo "Build files:"
            find . -type f \
              \( \
                -name "build.gradle" \
                -o -name "build.gradle.kts" \
                -o -name "settings.gradle" \
                -o -name "settings.gradle.kts" \
                -o -name "libs.versions.toml" \
                -o -name "gradle.properties" \
              \) \
              -not -path "./.git/*" \
              -print
          } > project-diagnostic-report.txt

      # ============================================================
      # 25. Upload Diagnostic Report
      # ============================================================

      - name: Upload Diagnostic Report
        uses: actions/upload-artifact@v4
        with:
          name: Android-Project-Diagnostic
          path: |
            project-diagnostic-report.txt
            gradle-tasks.log
          if-no-files-found: warn
          retention-days: 7
