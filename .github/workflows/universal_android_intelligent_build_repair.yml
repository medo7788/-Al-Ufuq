name: Universal Android Intelligent Build & Repair

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: universal-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Scan → Analyze → Compatibility → Repair → Build → APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle-home
      MAX_BUILD_ATTEMPTS: "5"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ==========================================================
      # 1. UNIVERSAL PROJECT SCANNER
      # ==========================================================
      - name: Scan Project
        id: scan
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci

          echo "=== UNIVERSAL ANDROID SCANNER ==="
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Commit: $GITHUB_SHA"
          echo "Runner: $RUNNER_OS / $(uname -m)"

          ROOT=""

          # Prefer a settings file that belongs to an Android project.
          while IFS= read -r f; do
            d="$(dirname "$f")"
            if find "$d" -type f -name AndroidManifest.xml \
              -not -path '*/build/*' | grep -q .; then
              ROOT="$d"
              break
            fi
          done < <(
            find . -type f \
              \( -name settings.gradle -o -name settings.gradle.kts \) \
              -not -path './.git/*' \
              -not -path './.gradle-home/*' | sort
          )

          if [ -z "$ROOT" ] && [ -f ./gradlew ]; then
            ROOT="."
          fi

          if [ -z "$ROOT" ]; then
            echo "ERROR: Android project not detected."
            exit 1
          fi

          echo "BUILD_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Detected project root: $ROOT"

          {
            echo "===== PROJECT MAP ====="
            find "$ROOT" \
              -not -path '*/.git/*' \
              -not -path '*/build/*' \
              -not -path '*/.gradle/*' \
              -print | sort
          } > .ci/project-map.txt

          {
            echo "===== IMPORTANT FILES ====="
            find "$ROOT" -type f \
              \( -name '*.gradle' -o -name '*.gradle.kts' \
              -o -name '*.toml' -o -name 'gradle.properties' \
              -o -name 'gradle-wrapper.properties' \
              -o -name 'AndroidManifest.xml' \) \
              -not -path '*/build/*' -print | sort
          } > .ci/important-files.txt

      # ==========================================================
      # 2. PROJECT ANALYZER
      # ==========================================================
      - name: Analyze Android Configuration
        shell: bash
        run: |
          set -euo pipefail
          cd "$BUILD_ROOT"

          {
            echo "===== SETTINGS ====="
            find . -type f \
              \( -name settings.gradle -o -name settings.gradle.kts \) \
              -not -path '*/build/*' \
              -exec sh -c 'echo; echo "### $1"; cat "$1"' _ {} \;

            echo
            echo "===== BUILD FILES ====="
            find . -type f \
              \( -name build.gradle -o -name build.gradle.kts \) \
              -not -path '*/build/*' \
              -exec sh -c 'echo; echo "### $1"; cat "$1"' _ {} \;

            echo
            echo "===== VERSION CATALOGS ====="
            find . -type f -name libs.versions.toml \
              -not -path '*/build/*' \
              -exec sh -c 'echo; echo "### $1"; cat "$1"' _ {} \;

            echo
            echo "===== GRADLE PROPERTIES ====="
            find . -type f -name gradle.properties \
              -not -path '*/build/*' \
              -exec sh -c 'echo; echo "### $1"; cat "$1"' _ {} \;
          } > "$GITHUB_WORKSPACE/.ci/project-configuration.txt"

          # Detect common Android toolchain components.
          grep -RniE \
            'com.android.application|com.android.library|com.android.tools.build:gradle|agp' \
            --include='*.gradle' --include='*.gradle.kts' --include='*.toml' . \
            2>/dev/null | head -500 > "$GITHUB_WORKSPACE/.ci/agp.txt" || true

          grep -RniE \
            'kotlin|ksp|kapt' \
            --include='*.gradle' --include='*.gradle.kts' --include='*.toml' . \
            2>/dev/null | head -500 > "$GITHUB_WORKSPACE/.ci/kotlin-ksp.txt" || true

          grep -RniE \
            'androidx.compose|compose-bom|composeOptions' \
            --include='*.gradle' --include='*.gradle.kts' --include='*.toml' . \
            2>/dev/null | head -500 > "$GITHUB_WORKSPACE/.ci/compose.txt" || true

          grep -RniE \
            'androidx.room|room-runtime|room-ktx|room-compiler' \
            --include='*.gradle' --include='*.gradle.kts' --include='*.toml' . \
            2>/dev/null | head -500 > "$GITHUB_WORKSPACE/.ci/room.txt" || true

          grep -RniE \
            'compileSdk|minSdk|targetSdk|jvmTarget|JavaVersion|toolchain' \
            --include='*.gradle' --include='*.gradle.kts' --include='*.toml' . \
            2>/dev/null | head -500 > "$GITHUB_WORKSPACE/.ci/android-toolchain.txt" || true

      # ==========================================================
      # 3. COMPATIBILITY ENGINE
      # ==========================================================
      - name: Determine Compatible Gradle and JDK
        id: compatibility
        shell: bash
        run: |
          set -euo pipefail
          cd "$BUILD_ROOT"

          AGP=""

          # Search version catalogs first.
          if [ -f gradle/libs.versions.toml ]; then
            AGP="$(grep -E \
              '^[[:space:]]*(agp|androidGradlePlugin)[[:space:]]*=' \
              gradle/libs.versions.toml \
              | head -1 \
              | grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?' \
              | head -1 || true)"
          fi

          # Then search build files/plugins.
          if [ -z "$AGP" ]; then
            AGP="$(grep -RhoE \
              'com\.android\.tools\.build:gradle:[0-9]+\.[0-9]+(\.[0-9]+)?' \
              --include='*.gradle' --include='*.gradle.kts' . \
              | head -1 \
              | grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?' \
              | tail -1 || true)"
          fi

          if [ -z "$AGP" ]; then
            AGP="$(grep -RhoE \
              'com\.android\.(application|library)[^0-9]*[0-9]+\.[0-9]+(\.[0-9]+)?' \
              --include='*.gradle' --include='*.gradle.kts' . \
              | grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?' \
              | tail -1 || true)"
          fi

          # Existing wrapper has priority over inferred Gradle.
          WRAPPER_VERSION=""
          if [ -f gradle/wrapper/gradle-wrapper.properties ]; then
            WRAPPER_VERSION="$(grep -oE \
              'gradle-[0-9]+(\.[0-9]+){1,2}' \
              gradle/wrapper/gradle-wrapper.properties \
              | head -1 | sed 's/gradle-//' || true)"
          fi

          GRADLE=""

          if [ -n "$WRAPPER_VERSION" ]; then
            GRADLE="$WRAPPER_VERSION"
            REASON="repository wrapper"
          elif [ "$AGP" = "9.1.1" ]; then
            GRADLE="9.3.1"
            REASON="AGP 9.1.1 compatibility"
          elif [ -n "$AGP" ]; then
            AGP_MAJOR="$(echo "$AGP" | cut -d. -f1)"
            AGP_MINOR="$(echo "$AGP" | cut -d. -f2)"

            # Conservative mappings for common Android Studio/AGP generations.
            if [ "$AGP_MAJOR" -ge 9 ]; then
              GRADLE="9.3.1"
            elif [ "$AGP_MAJOR" -eq 8 ] && [ "$AGP_MINOR" -ge 5 ]; then
              GRADLE="8.7"
            elif [ "$AGP_MAJOR" -eq 8 ] && [ "$AGP_MINOR" -ge 2 ]; then
              GRADLE="8.2"
            elif [ "$AGP_MAJOR" -eq 8 ]; then
              GRADLE="8.0"
            elif [ "$AGP_MAJOR" -eq 7 ]; then
              GRADLE="7.6"
            else
              GRADLE="8.7"
            fi
            REASON="AGP compatibility mapping"
          else
            GRADLE="8.7"
            REASON="no AGP version detected; bootstrap fallback"
          fi

          # Modern Android Gradle Plugin projects use JDK 17.
          JDK="17"

          echo "AGP=$AGP"
          echo "Gradle=$GRADLE"
          echo "JDK=$JDK"
          echo "Reason=$REASON"

          {
            echo "AGP=$AGP"
            echo "Gradle=$GRADLE"
            echo "JDK=$JDK"
            echo "Reason=$REASON"
          } | tee "$GITHUB_WORKSPACE/.ci/compatibility.txt"

          echo "GRADLE_VERSION=$GRADLE" >> "$GITHUB_ENV"
          echo "JDK_VERSION=$JDK" >> "$GITHUB_ENV"
          echo "AGP_VERSION=$AGP" >> "$GITHUB_ENV"

      # ==========================================================
      # 4. JAVA
      # ==========================================================
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JDK_VERSION }}
          cache: gradle

      # ==========================================================
      # 5. GRADLE ENGINE
      # ==========================================================
      - name: Prepare Gradle Engine
        shell: bash
        run: |
          set -euo pipefail

          cd "$BUILD_ROOT"

          CMD=""

          if [ -f ./gradlew ] &&
             [ -f gradle/wrapper/gradle-wrapper.jar ] &&
             [ -f gradle/wrapper/gradle-wrapper.properties ]; then

            chmod +x ./gradlew

            if ./gradlew --version > "$GITHUB_WORKSPACE/.ci/wrapper-test.txt" 2>&1; then
              CMD="$BUILD_ROOT/gradlew"
              echo "Using project Gradle Wrapper."
            else
              echo "Project wrapper is unusable. Using compatible downloaded Gradle."
            fi
          fi

          if [ -z "$CMD" ]; then
            mkdir -p "$GITHUB_WORKSPACE/.ci/gradle"

            cd "$GITHUB_WORKSPACE/.ci/gradle"

            if [ ! -x "gradle-$GRADLE_VERSION/bin/gradle" ]; then
              wget -q \
                "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
              unzip -q "gradle-${GRADLE_VERSION}-bin.zip"
            fi

            CMD="$GITHUB_WORKSPACE/.ci/gradle/gradle-$GRADLE_VERSION/bin/gradle"
          fi

          echo "GRADLE_CMD=$CMD" >> "$GITHUB_ENV"

          "$CMD" --version \
            | tee "$GITHUB_WORKSPACE/.ci/gradle-version.txt"

      # ==========================================================
      # 6. DISCOVER TASKS
      # ==========================================================
      - name: Discover Android Tasks
        shell: bash
        run: |
          set +e
          cd "$BUILD_ROOT"

          "$GRADLE_CMD" projects \
            --no-daemon --console=plain \
            2>&1 | tee "$GITHUB_WORKSPACE/.ci/projects.txt"

          "$GRADLE_CMD" tasks --all \
            --no-daemon --console=plain \
            2>&1 | tee "$GITHUB_WORKSPACE/.ci/tasks.txt"

          TASK=""

          if grep -qE '(^|[[:space:]])assembleDebug([[:space:]]|$)' \
              "$GITHUB_WORKSPACE/.ci/tasks.txt"; then
            TASK="assembleDebug"
          elif grep -qE '(^|[[:space:]])assembleRelease([[:space:]]|$)' \
              "$GITHUB_WORKSPACE/.ci/tasks.txt"; then
            TASK="assembleRelease"
          elif grep -qE '(^|[[:space:]])assemble([[:space:]]|$)' \
              "$GITHUB_WORKSPACE/.ci/tasks.txt"; then
            TASK="assemble"
          fi

          if [ -z "$TASK" ]; then
            echo "ERROR: No Android assemble task found."
            exit 1
          fi

          echo "BUILD_TASK=$TASK" >> "$GITHUB_ENV"
          echo "Selected build task: $TASK"

      # ==========================================================
      # 7. SAFE CLEANUP
      # ==========================================================
      - name: Safe Generated-State Cleanup
        shell: bash
        run: |
          set -euo pipefail

          find "$BUILD_ROOT" -type d \
            \( -name build -o -name .gradle \) \
            -not -path '*/.git/*' \
            -prune -exec rm -rf {} + 2>/dev/null || true

          find "$BUILD_ROOT" -type f -name gradlew \
            -exec chmod +x {} \; 2>/dev/null || true

      # ==========================================================
      # 8. BUILD + INTELLIGENT SAFE REPAIR LOOP
      # ==========================================================
      - name: Intelligent Build Repair Loop
        shell: bash
        run: |
          set +e

          mkdir -p "$GITHUB_WORKSPACE/.ci/builds"

          ATTEMPT=1
          SUCCESS=0

          while [ "$ATTEMPT" -le "$MAX_BUILD_ATTEMPTS" ]; do

            cd "$BUILD_ROOT"

            LOG="$GITHUB_WORKSPACE/.ci/builds/build-${ATTEMPT}.log"

            echo
            echo "============================================================"
            echo "BUILD ATTEMPT $ATTEMPT / $MAX_BUILD_ATTEMPTS"
            echo "Gradle: $GRADLE_VERSION"
            echo "JDK: $JDK_VERSION"
            echo "AGP: ${AGP_VERSION:-unknown}"
            echo "Task: $BUILD_TASK"
            echo "============================================================"

            "$GRADLE_CMD" "$BUILD_TASK" \
              --no-daemon \
              --console=plain \
              --stacktrace \
              --warning-mode=all \
              2>&1 | tee "$LOG"

            STATUS=${PIPESTATUS[0]}

            if [ "$STATUS" -eq 0 ]; then
              SUCCESS=1
              echo "BUILD SUCCESSFUL"
              break
            fi

            # Generate a concise failure report.
            {
              echo "===== FAILURE SUMMARY ====="
              grep -nA35 'What went wrong:' "$LOG" | head -180 || true
              echo
              echo "===== FAILED TASK ====="
              grep -E 'Execution failed for task|FAILURE:|BUILD FAILED' "$LOG" | tail -100 || true
              echo
              echo "===== CAUSED BY ====="
              grep -nA20 'Caused by:' "$LOG" | head -180 || true
              echo
              echo "===== IMPORTANT ERRORS ====="
              grep -Ei \
                'error:|e: |exception|failed|failure|cannot|could not|unsupported|incompatible|duplicate|unresolved reference|resource linking' \
                "$LOG" | tail -300 || true
            } > "$GITHUB_WORKSPACE/.ci/builds/root-cause-${ATTEMPT}.txt"

            # ------------------------------------------------------
            # SAFE REPAIR A: NETWORK / DEPENDENCY CACHE
            # ------------------------------------------------------
            if grep -Eqi \
              'Could not resolve|Could not GET|Could not HEAD|Connection reset|Connection timed out|Temporary failure|PKIX|UnknownHostException|Network is unreachable|metadata.*could not be retrieved' \
              "$LOG"; then

              echo "SAFE REPAIR: dependency/network cache."

              rm -rf \
                "$GRADLE_USER_HOME/caches/modules-2/metadata-*" \
                "$GRADLE_USER_HOME/caches/modules-2/files-2.1" \
                2>/dev/null || true

              ATTEMPT=$((ATTEMPT + 1))
              continue
            fi

            # ------------------------------------------------------
            # SAFE REPAIR B: DAEMON / JVM
            # ------------------------------------------------------
            if grep -Eqi \
              'DaemonDisappearedException|daemon disappeared|OutOfMemoryError|Java heap space|GC overhead limit exceeded|Metaspace' \
              "$LOG"; then

              echo "SAFE REPAIR: Gradle/JVM generated state."

              "$GRADLE_CMD" --stop >/dev/null 2>&1 || true
              rm -rf "$BUILD_ROOT/.gradle" "$GRADLE_USER_HOME/caches" 2>/dev/null || true

              ATTEMPT=$((ATTEMPT + 1))
              continue
            fi

            # ------------------------------------------------------
            # SAFE REPAIR C: LOCK/CACHE CORRUPTION
            # ------------------------------------------------------
            if grep -Eqi \
              'Could not acquire lock|Timeout waiting to lock|cache.*corrupt|corrupt.*cache|failed to read cache' \
              "$LOG"; then

              echo "SAFE REPAIR: cache/lock state."

              "$GRADLE_CMD" --stop >/dev/null 2>&1 || true
              rm -rf "$BUILD_ROOT/.gradle" 2>/dev/null || true

              find "$GRADLE_USER_HOME" -type f \
                \( -name '*.lock' -o -name '*.lck' \) \
                -delete 2>/dev/null || true

              ATTEMPT=$((ATTEMPT + 1))
              continue
            fi

            # ------------------------------------------------------
            # SAFE REPAIR D: WRAPPER FAILURE
            # ------------------------------------------------------
            if grep -Eqi \
              'GradleWrapperMain|gradle-wrapper\.jar|Could not find or load main class org\.gradle\.wrapper' \
              "$LOG"; then

              echo "SAFE REPAIR: use downloaded compatible Gradle."

              FALLBACK="$GITHUB_WORKSPACE/.ci/gradle/gradle-$GRADLE_VERSION/bin/gradle"

              if [ -x "$FALLBACK" ]; then
                echo "GRADLE_CMD=$FALLBACK" >> "$GITHUB_ENV"
                export GRADLE_CMD="$FALLBACK"
                ATTEMPT=$((ATTEMPT + 1))
                continue
              fi

              break
            fi

            # ------------------------------------------------------
            # SAFE REPAIR E: KSP / INTELLIJ AWT
            # ------------------------------------------------------
            if grep -Eqi \
              'AWT-EventQueue-0|ApplicationManager.getApplication\(\).*null|ksp\.com\.intellij|com\.intellij\.openapi\.application' \
              "$LOG"; then

              # Do NOT treat the AWT message as root cause by itself.
              if ! grep -Eqi \
                'Execution failed for task.*ksp|:ksp[^ ]* FAILED|KSP.*(error|failed)|KotlinSymbolProcessing' \
                "$LOG"; then

                echo "KSP/IntelliJ AWT message is not proven to be fatal."
                echo "Retrying without destructive source changes."

                ATTEMPT=$((ATTEMPT + 1))
                continue
              fi

              if grep -Eqi \
                'Could not resolve.*ksp|ksp.*Could not resolve' \
                "$LOG"; then

                echo "SAFE REPAIR: KSP dependency cache."

                rm -rf "$GRADLE_USER_HOME/caches/modules-2" 2>/dev/null || true

                ATTEMPT=$((ATTEMPT + 1))
                continue
              fi

              echo "KSP is genuinely build-critical."
              echo "No safe automatic source modification will be performed."
              break
            fi

            # ------------------------------------------------------
            # SOURCE / COMPILER / RESOURCE FAILURES
            # ------------------------------------------------------
            if grep -Eqi \
              'Unresolved reference|Type mismatch|Compilation error|Expecting |Cannot access|Duplicate class|Manifest merger failed|AAPT:|Android resource linking failed|DexArchiveMergerException|Duplicate resources|Kotlin compiler|Java compilation' \
              "$LOG"; then

              echo "Source/configuration-specific build failure detected."
              echo "Automatic source modification is intentionally disabled."
              break
            fi

            echo "No safe repair rule matched."
            break
          done

          if [ "$SUCCESS" -ne 1 ]; then
            echo "BUILD FAILED after $ATTEMPT attempt(s)."
            exit 1
          fi

      # ==========================================================
      # 9. APK DISCOVERY + VERIFICATION
      # ==========================================================
      - name: Verify APK
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p final-apk

          mapfile -t APKS < <(
            find "$BUILD_ROOT" -type f \
              -path '*/build/outputs/apk/*.apk' \
              -not -path '*/intermediates/*' \
              -print
          )

          if [ "${#APKS[@]}" -eq 0 ]; then
            echo "ERROR: Build succeeded but no APK was found."
            exit 1
          fi

          for apk in "${APKS[@]}"; do
            echo "APK: $apk"
            ls -lh "$apk"
            cp "$apk" final-apk/
          done

          echo "=== FINAL APK FILES ==="
          find final-apk -type f -name '*.apk' -exec ls -lh {} \;

      # ==========================================================
      # 10. UPLOAD APK
      # ==========================================================
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: final-apk/*.apk
          if-no-files-found: error
          retention-days: 14

      # ==========================================================
      # 11. UPLOAD FULL DIAGNOSTICS
      # ==========================================================
      - name: Upload Diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-AutoBuild-Diagnostics
          path: .ci/
          if-no-files-found: warn
          retention-days: 14

      # ==========================================================
      # 12. SAFE WRAPPER PERSISTENCE
      # ==========================================================
      - name: Persist Generated Wrapper
        if: success()
        shell: bash
        run: |
          set +e
          cd "$BUILD_ROOT"

          # Only generate/persist a wrapper when the project had no wrapper.
          if [ ! -f gradlew ] && [ -x "$GITHUB_WORKSPACE/.ci/gradle/gradle-$GRADLE_VERSION/bin/gradle" ]; then

            echo "Generating Gradle Wrapper $GRADLE_VERSION for future builds."

            "$GITHUB_WORKSPACE/.ci/gradle/gradle-$GRADLE_VERSION/bin/gradle" wrapper \
              --gradle-version "$GRADLE_VERSION" \
              --no-daemon

            chmod +x gradlew

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add gradlew gradlew.bat gradle/wrapper 2>/dev/null || true

            if ! git diff --cached --quiet; then
              git commit -m "ci: add compatible Gradle wrapper"
              git push
            fi
          else
            echo "Existing wrapper preserved; no source/config changes."
          fi
