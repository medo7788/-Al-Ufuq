name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # استخدام كاش Gradle الرسمي والأسرع بدل التنزيل اليدوي
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # إصلاح الـ Wrapper فقط في حال عدم وجوده بدون فرض إصدار 9 المكسور
      - name: Ensure Gradle Wrapper
        run: |
          if [ ! -f ./gradlew ]; then
            echo "gradlew is missing, generating wrapper using installed Gradle..."
            gradle wrapper
          fi
          chmod +x ./gradlew

      - name: Build Debug APK
        run: |
          ./gradlew :app:assembleDebug \
            --stacktrace \
            --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AlUfuq-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
