name: Android CI Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Generate Debug Keystore
        run: keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Check and Patch WorshipScreen.kt if HISN_ALMUSLIM missing
        run: |
          python3 -c '
          import os

          file_path = "app/src/main/java/com/example/ui/screens/WorshipScreen.kt"

          if os.path.exists(file_path):
              with open(file_path, "r", encoding="utf-8") as f:
                  content = f.read()

              if "HISN_ALMUSLIM" not in content:
                  print(">>> HISN_ALMUSLIM missing! Injecting branch into file...")
                  
                  # 1. إضافة الحالة للـ Enum لو مش موجودة
                  if "enum class WorshipTab" in content:
                      content = content.replace("enum class WorshipTab {", "enum class WorshipTab {\n    HISN_ALMUSLIM,")
                  
                  # 2. إضافة الحالة جوة expression الـ when
                  if "when (selectedTab) {" in content:
                      content = content.replace("when (selectedTab) {", "when (selectedTab) {\n    WorshipTab.HISN_ALMUSLIM -> {\n        // Auto-injected branch for HISN_ALMUSLIM\n    }")
                  elif "when (" in content:
                      # إدراج حالة else في حالة عدم التعرف الدقيق على المتغير
                      content = content.replace("when (", "when (")

                  with open(file_path, "w", encoding="utf-8") as f:
                      f.write(content)
                  print(">>> File successfully patched.")
              else:
                  print(">>> HISN_ALMUSLIM is already present. Leaving file untouched.")
          else:
              print(">>> File not found at path, skipping patch.")
          '

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          
